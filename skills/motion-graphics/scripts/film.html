<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Film</title>
<!--
  A deterministic film skeleton. Copy it, then replace the scenes.
  Contract (used by export-film.mjs and film-snap.mjs):
    window.__film = { D, CUTS, render(t), exportMode(ar) }   ar: "h" 1920×1080 · "v" 1080×1920 · "s" 1080×1080
    CUTS: times of hard cuts (s); export keeps sub-frames on their own side of each, film-snap --cuts reviews them.
  render(t) must draw the whole frame from t alone: no CSS transitions/animations, no Date.now(), no unseeded random.
  Open the file in a browser to play and scrub it.
-->
<style>
:root{
  --off:#f3f2f0; --ink:#0a0a0a; --night:#0b0b0c; --accent:#ff6a2a;
  --f:"Pretendard","Apple SD Gothic Neo",-apple-system,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#111;color:#eee;font-family:var(--f)}
.view{position:fixed;inset:0 0 56px 0;overflow:hidden;background:#000}
.stage{position:absolute;left:50%;top:50%;overflow:hidden;contain:strict;transform-origin:0 0}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.scene{position:absolute;inset:0;display:none;overflow:hidden}
.o{position:absolute;left:50%;top:50%;transform-origin:50% 50%;will-change:transform}
.bar{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;font:500 14px var(--mono)}
.bar input{flex:1}
.bar button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid #444;background:#1c1c1c;color:#eee}
body.export .bar{display:none}
body.export .view{inset:0}

/* scenes */
#s1{background:var(--night)}
#s2{background:var(--off);color:var(--ink)}
#s3{background:var(--night)}
.mark{width:160px;height:160px;background:linear-gradient(135deg,#ffb21a,#ff6a2a 55%,#e0263f)}
.word{font:700 132px/1.1 var(--f);letter-spacing:-.045em;white-space:nowrap}
.word .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.word .w>span{display:inline-block}
.word .acc{color:var(--accent)}
.prompt{width:1180px;height:170px;border-radius:32px;background:#1d1d1f;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 30px 80px rgba(0,0,0,.45)}
.prompt .tx{position:absolute;left:44px;top:42px;right:44px;font:500 44px/1.2 var(--f);letter-spacing:-.02em;color:#ececec;white-space:nowrap}
.prompt .ph{color:#86868b}
.prompt .car{display:inline-block;width:3px;height:1.05em;background:var(--accent);vertical-align:-.16em;margin-left:2px}
.glow{position:absolute;left:50%;bottom:-40%;width:140%;height:80%;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,106,42,.55),rgba(224,38,63,.25) 55%,transparent)}
</style>
</head>
<body>
<div class="view" id="view"><div class="stage" id="stage"><div id="cam">
  <section class="scene" id="s1"><div class="o mark" id="mk"></div></section>
  <section class="scene" id="s2"><div class="o word" id="line"></div></section>
  <section class="scene" id="s3"><div class="glow" id="glow"></div><div class="o prompt" id="pr"><div class="tx" id="tx"></div></div></section>
</div></div></div>
<div class="bar"><button id="play">❚❚</button><input id="scrub" type="range" min="0" step="0.01"><span id="time"></span>
  <button data-ar="h">16:9</button><button data-ar="v">9:16</button><button data-ar="s">1:1</button></div>
<script>
// ───────── strings (one table per language; build a second language by switching LANG)
const LANG = new URLSearchParams(location.search).get('lang') || 'ko';
const TXT = {
  ko: { line: ['사람처럼', '디자인하는', 'AI'], accent: 0, ask: '성수동 빵집 예약 페이지 만들어줘', ph: '무엇을 만들까요?' },
  en: { line: ['An', 'AI', 'that', 'designs', 'like', 'a', 'human'], accent: 3, ask: 'Make a booking page for a bakery', ph: 'What should we make?' },
}[LANG];

// ───────── time helpers
const BPM = 120, BEAT = 60 / BPM, BAR = BEAT * 4;
const FPS = 30;
// beat k in seconds, snapped to a frame from its index (never by adding rounded beats: that drifts)
const beatT = k => Math.round(k * BEAT * FPS) / FPS;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (t, a, b) => clamp((t - a) / (b - a));          // 0→1 between a and b
const E = {
  lin: k => k,
  sine: k => -(Math.cos(Math.PI * k) - 1) / 2,                 // camera: peak speed ~1.6× average
  cubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,   // object moves
  out: k => 1 - Math.pow(1 - k, 3),
  back: (k, s = 1.4) => 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2),   // pops with slight overshoot
  spring: (k, f = 4.2, d = 5.5) => k >= 1 ? 1 : 1 - Math.exp(-d * k) * Math.cos(f * Math.PI * k),
  // no quint/expo in-out for short moves: peak speed ~5× average → smear
};
const tw = (t, a, b, from, to, ease = E.cubic) => lerp(from, to, ease(prog(t, a, b)));
// seeded random, so every render of frame t is identical
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

// human typing: per-key times with jitter, longer after spaces/punctuation
function keyTimes(text, start, seed = 7) {
  const r = rng(seed), out = []; let t = start;
  for (const ch of text) { out.push(t); t += .055 + r() * .03 + (/[\s,.!?]/.test(ch) ? .12 + r() * .1 : 0); }
  return out;
}
const typed = (text, times, t) => text.slice(0, times.filter(x => x <= t).length);

// ───────── stage and aspect ratio
const AR = { h: [1920, 1080], v: [1080, 1920], s: [1080, 1080] };
let ar = 'h', W = 1920, H = 1080;
const pick = (h, v, s) => ({ h, v, s })[ar] ?? h;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const stage = $('#stage'), view = $('#view'), cam = $('#cam');
const place = (el, x, y, s = 1, extra = '') => { el.style.transform = `translate(-50%,-50%) translate(${x}px,${y}px) scale(${s}) ${extra}`; };

// ───────── scenes: {id, a, b} on bar lines; each render gets local time
const SC = [
  { id: 's1', a: 0, b: BAR },
  { id: 's2', a: BAR, b: BAR * 2 },
  { id: 's3', a: BAR * 2, b: BAR * 4 },
];
const D = SC[SC.length - 1].b;
const CUTS = SC.slice(1).map(s => s.a);   // every scene change here is a hard cut; drop the ones that are seams

const lineEl = $('#line');
lineEl.innerHTML = TXT.line.map((w, i) => `<span class="w"><span class="${i === TXT.accent ? 'acc' : ''}">${w}</span></span>`).join(' ');
const words = $$('#line .w>span');
const ASK_AT = beatT(1), ASK_KEYS = keyTimes(TXT.ask, ASK_AT);

const R = {
  s1(t) {   // the mark arrives with a spring, then holds; one motion language for it all film long
    const k = E.spring(prog(t, .1, 1.1));
    place($('#mk'), 0, 0, lerp(.2, 1, k), `rotate(${lerp(-12, 0, k)}deg)`);
  },
  s2(t) {   // words rise through their own mask, one per 8th note; hold ≥ 1.5 s
    words.forEach((w, i) => { const k = E.out(prog(t, .1 + i * BEAT / 2, .1 + i * BEAT / 2 + .45)); w.style.transform = `translateY(${(1 - k) * 110}%)`; });
    place(lineEl, 0, 0, pick(1, .62, .7));
  },
  s3(t) {   // prompt bar fills the frame; slow sine push-in while typing; placeholder vanishes on the first key
    const s = pick(1.3, .8, .8) * tw(t, 0, BAR * 2, 1, 1.08, E.sine);
    place($('#pr'), 0, tw(t, 0, .8, 80, 0, E.cubic), s);
    $('#pr').style.opacity = tw(t, 0, .4, 0, 1, E.lin);
    const txt = typed(TXT.ask, ASK_KEYS, t);
    const blink = Math.floor(t / .5) % 2 === 0 || txt.length < TXT.ask.length;
    $('#tx').innerHTML = (txt ? txt.replace(/</g, '&lt;') : `<span class="ph">${TXT.ph}</span>`) + (blink ? '<span class="car"></span>' : '');
    $('#glow').style.opacity = tw(t, 0, 1.2, 0, 1, E.sine);
  },
};

function render(t) {
  let cur = SC.findLast(s => t >= s.a) || SC[0];
  for (const s of SC) $('#' + s.id).style.display = s === cur ? 'block' : 'none';
  R[cur.id](t - cur.a);
  // the stage takes the current scene's color so camera moves never reveal a white edge
  stage.style.background = getComputedStyle($('#' + cur.id)).backgroundColor;
}

// ───────── player (scrub, play, aspect) and export hooks
let t = 0, playing = true, last = null;
function fit() {
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  if (document.body.classList.contains('export')) { stage.style.transform = 'translate(-50%,-50%)'; stage.style.transformOrigin = '50% 50%'; return; }
  const s = Math.min(view.clientWidth / W, view.clientHeight / H);
  stage.style.transformOrigin = '0 0'; stage.style.transform = `translate(${-W * s / 2}px,${-H * s / 2}px) scale(${s})`;
}
function setAR(a) { ar = a; [W, H] = AR[a]; fit(); render(t); }
const scrub = $('#scrub'); scrub.max = D;
function ui() { scrub.value = t; $('#time').textContent = `${t.toFixed(2)} / ${D.toFixed(2)}`; }
function frame(now) {
  if (playing) { if (last != null) t = (t + Math.min((now - last) / 1000, .1)) % D; last = now; render(t); ui(); }
  requestAnimationFrame(frame);
}
$('#play').onclick = () => { playing = !playing; last = null; $('#play').textContent = playing ? '❚❚' : '▶'; };
scrub.oninput = () => { t = +scrub.value; render(t); ui(); };
$$('[data-ar]').forEach(b => b.onclick = () => setAR(b.dataset.ar));
addEventListener('resize', fit);
window.__film = { D, CUTS, render: x => { t = x; render(x); }, exportMode: a => { document.body.classList.add('export'); playing = false; setAR(a); } };
fit(); render(0); ui();
document.fonts?.ready.then(() => render(t));
requestAnimationFrame(frame);
</script>
</body>
</html>
