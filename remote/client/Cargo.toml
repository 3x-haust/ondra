[package]
name = "ondra-remote-client"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.91"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "1", default-features = false, features = ["tls-ring"] }
wasm-bindgen = "=0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.3", features = ["wasm_js"] }
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
