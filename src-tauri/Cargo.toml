[package]
name = "ondra"
version = "0.1.0"
description = "Throw tasks in; a captain splits them and agents run them in parallel."
authors = ["3x-haust"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "ondra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastembed = { version = "=4.9.1", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# the embedding model runs on these; unoptimized they are ~50x slower in dev builds
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.fastembed]
opt-level = 3

[target."cfg(target_os = \"macos\")".dependencies]
mac-notification-sys = "0.6"
