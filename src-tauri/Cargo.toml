[package]
name = "ondra"
version = "0.38.19"
description = "Throw tasks in; a captain splits them and agents run them in parallel."
authors = ["3x-haust"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name.
name = "ondra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png", "protocol-asset", "unstable"] }
tauri-plugin-global-shortcut = "2"
# 2.13+ needs Rust 1.90
tauri-plugin-updater = "=2.12.0"
# components (see components.rs) download with the same client stack the updater uses
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
futures-util = "0.3"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastembed = { version = "=4.9.1", default-features = false, features = ["ort-download-binaries", "hf-hub-native-tls"] }
portable-pty = "0.9"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
# full `strip = true` leaves dylibs that macOS 27's dyld refuses to load
# ("mis-aligned LINKEDIT string pool"), which breaks proc-macros in release builds
strip = "debuginfo"

[profile.release.build-override]
strip = false

# the embedding model runs on these; unoptimized they are ~50x slower in dev builds
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.ort]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.fastembed]
opt-level = 3

[target."cfg(target_os = \"macos\")".dependencies]
mac-notification-sys = "0.6"
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSString", "NSDictionary", "NSDate", "NSOperation", "NSObject", "NSRunLoop"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "libc", "NSWorkspace", "NSRunningApplication"] }
