name: Windows and Linux release

# A release published from the Mac (scripts/release.mjs) gets the Windows installer and the Linux
# packages of the same commit: built and checked as on every push, signed for the updater, added to
# the release, and named in its latest.json so installed apps on those systems update too.
on:
  release:
    types: [published]
  # again for a release whose run failed: the tag to build
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (v0.92.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag }}

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit

  linux:
    uses: ./.github/workflows/linux.yml
    with:
      tag: ${{ github.event.release.tag_name || inputs.tag }}
    secrets: inherit

  publish:
    name: Add the Windows and Linux packages to the release
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: Ondra-*
          path: packages
          merge-multiple: true

      - name: Upload them and name them in latest.json
        run: node scripts/release-desktop.mjs "$TAG" packages
