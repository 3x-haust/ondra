name: Linux packages

on:
  pull_request:
  # Builds on main leave the Rust cache that pull requests start from.
  push:
    branches: [main]
  workflow_dispatch:
  # A published release: .github/workflows/release.yml builds this for it and adds it to the release.
  workflow_call:
    inputs:
      tag:
        description: the release tag to build (its commit) and sign the package of for the updater
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: linux-packages-${{ github.event.pull_request.number || github.ref }}
  # Only main saves the caches every build starts from, so a main build runs to the end (a newer push
  # waits for it) instead of being cancelled before it saves anything.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # A pull request only checks that the app and its helpers compile for Linux (a few minutes);
  # main, a release and a manual run (Actions → Run workflow, on any branch) build the packages,
  # install them and use them (the build jobs below).
  check:
    name: Compile check (x64)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      TARGET: x86_64-unknown-linux-gnu
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install system libraries and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # `cargo check` keeps other files than a release build, so it has its own cache (main saves it).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            src-tauri -> target
            remote/host -> target
            dictate -> target
            browser -> target

      - name: Compile the app and its helpers
        run: |
          node .github/check-stubs.mjs "$TARGET"
          for crate in src-tauri remote/host dictate browser; do
            cargo check --manifest-path "$crate/Cargo.toml" --target "$TARGET" --locked --all-targets
          done

  build:
    name: Build and verify deb and rpm (x64)
    if: github.event_name != 'pull_request'
    # The oldest supported runner: the packages run on systems with this glibc or newer.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      ENGINE_REV: 9e1cdd29cc4c765f8ac987657f2fdb59357d4d29
      TARGET: x86_64-unknown-linux-gnu
      RUSTUP_TOOLCHAIN: 1.95.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'
          no-cache: true

      - name: Install system libraries, pnpm and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev patchelf xvfb dbus-x11 gnome-keyring libsecret-tools
          npm install --global --prefix "$RUNNER_TEMP/pnpm" pnpm@11.6.0
          echo "$RUNNER_TEMP/pnpm/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      # Restores the compiled dependencies of every crate the build compiles (the app, the remote
      # helper, and the dictation and browser helpers the app's build script makes, each with its own
      # target dir) and the cargo registry; only those crates themselves are compiled again. The key
      # follows the toolchain and the Cargo.locks.
      # Only main saves it (pull requests read main's caches): one copy per pull request filled the
      # repository's 10 GB, and GitHub then deleted the caches builds were about to use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: |
            src-tauri -> target
            remote/host -> target
            dictate -> target
            browser -> target

      # The app crate is compiled again on every run (the checkout makes its sources new), so the
      # incremental state of the last build here or on main is kept: rustc then redoes only the code
      # that changed. main saves it under each commit; the newest one comes back.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target/${{ env.TARGET }}/release/incremental
          key: ondra-incremental-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: ondra-incremental-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      # The remote helper (fat LTO) takes one to two minutes and rarely changes. Its build is kept
      # under the hash of its sources and this file; on an exact match those sources are dated back, so cargo
      # finds the kept build up to date and uses it instead of compiling it again.
      - id: remote
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            remote/host/target/${{ env.TARGET }}/release/ondra?remote*
            remote/host/target/${{ env.TARGET }}/release/deps/ondra?remote*
            remote/host/target/${{ env.TARGET }}/release/.fingerprint/ondra-remote-*
          key: ondra-remote-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('remote/host/**', '!remote/host/target/**', '.github/workflows/linux.yml') }}

      - name: Use the kept remote helper build
        if: steps.remote.outputs.cache-hit == 'true'
        run: git ls-files -z remote/host | xargs -0 touch -d 2000-01-01

      # The dictation helper, the same way (its own crate only).
      - id: dictate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            dictate/target/${{ env.TARGET }}/release/ondra?dictate*
            dictate/target/${{ env.TARGET }}/release/deps/ondra?dictate*
            dictate/target/${{ env.TARGET }}/release/.fingerprint/ondra-dictate-*
          key: ondra-dictate-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('dictate/**', '!dictate/target/**', '.github/workflows/linux.yml') }}

      - name: Use the kept dictation helper build
        if: steps.dictate.outputs.cache-hit == 'true'
        run: git ls-files -z dictate | xargs -0 touch -d 2000-01-01

      - name: Build the pinned coding agent
        run: |
          engine="$RUNNER_TEMP/engine"
          git init --quiet "$engine"
          cd "$engine"
          git fetch --no-tags --depth 1 https://github.com/3x-haust/3xhaustpi.git "$ENGINE_REV"
          git checkout --detach "$ENGINE_REV"
          npm ci --ignore-scripts
          npm run build:offline
          echo "ONDRA_ENGINE_DIST=$PWD/packages/coding-agent/dist" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        # rust-cache turns incremental builds off; the release profile's own setting (on for the app,
        # off for the remote helper) applies here, as in a release build.
        run: |
          unset CARGO_INCREMENTAL
          pnpm tauri build --target "$TARGET" --bundles deb,rpm --ci -- --locked

      - name: Save the incremental build state
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target/${{ env.TARGET }}/release/incremental
          key: ondra-incremental-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ github.sha }}

      - name: Verify the installed package
        run: |
          bundles="src-tauri/target/$TARGET/release/bundle"
          deb=$(ls "$bundles"/deb/*.deb)
          rpm=$(ls "$bundles"/rpm/*.rpm)
          sudo apt-get install -y "./$deb"
          lib=/usr/lib/Ondra
          for f in /usr/bin/ondra /usr/bin/ondra-remote /usr/bin/ondra-dictate /usr/bin/ondra-browser $lib/components.json $lib/engine/ondra-engine $lib/engine/package.json $lib/engine/photon_rs_bg.wasm \
                   $lib/engine/native/linux/prebuilds/linux-x64/linux-platform-x11.node $lib/engine/THIRD_PARTY_NOTICES.txt; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          cmp /usr/bin/ondra-remote "src-tauri/binaries/ondra-remote-$TARGET"
          cmp /usr/bin/ondra-dictate "src-tauri/binaries/ondra-dictate-$TARGET"
          cargo test --manifest-path dictate/Cargo.toml --release --target "$TARGET" --locked
          expected=$(node -p "require('$ONDRA_ENGINE_DIST/../package.json').version")
          version=$($lib/engine/ondra-engine --version)
          [ "$version" = "$expected" ] || { echo "engine reported '$version', expected '$expected'"; exit 1; }
          sha256sum "$deb" "$rpm"

      - name: Start the installed app and use its browser
        timeout-minutes: 15
        run: .github/browser/linux.sh

      # a release: each package is also its own update package, signed with the updater key (never printed)
      - name: Sign the packages for the updater
        if: inputs.tag != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "TAURI_SIGNING_PRIVATE_KEY is not set for this repository"; exit 1; }
          bundles="src-tauri/target/$TARGET/release/bundle"
          for f in "$bundles"/deb/*.deb "$bundles"/rpm/*.rpm; do
            pnpm -s tauri signer sign "$f" > /dev/null
            test -s "$f.sig" || { echo "signing $f failed"; exit 1; }
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ondra-linux-x64
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm.sig
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  browser-noble:
    name: Browser on Ubuntu 24.04 (user namespaces restricted)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Ondra-linux-x64
          path: packages

      - name: Install the deb where Chrome needs the AppArmor profile
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11 gnome-keyring libsecret-tools
          sudo apt-get install -y ./packages/deb/*.deb
          sudo apparmor_parser -N /etc/apparmor.d/ondra-chrome

      - name: Start the installed app and use its browser
        timeout-minutes: 15
        run: .github/browser/linux.sh
