name: Windows installer

on:
  pull_request:
  # Builds on main leave the Rust cache that pull requests start from.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify NSIS (x64 MSVC)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      ENGINE_REV: 9e1cdd29cc4c765f8ac987657f2fdb59357d4d29
      TARGET: x86_64-pc-windows-msvc
      RUSTUP_TOOLCHAIN: 1.95.0-x86_64-pc-windows-msvc
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24.14.0'
          package-manager-cache: false

      - id: bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip
          no-cache: true

      - name: Install pnpm and Rust MSVC
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = Join-Path $env:RUNNER_TEMP pnpm
          npm install --global --prefix $tools pnpm@11.6.0
          $tools >> $env:GITHUB_PATH
          rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal

      # Restores the compiled dependencies of both crates and the cargo registry; only the app and
      # the remote helper themselves are compiled again. The key follows the toolchain and Cargo.lock.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            remote/host -> target

      # The app crate is compiled again on every run (the checkout makes its sources new), so the
      # incremental state of the last build here or on main is kept: rustc then redoes only the code
      # that changed. Saved under each commit; the newest one of this pull request or main comes back.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: src-tauri/target/${{ env.TARGET }}/release/incremental
          key: ondra-incremental-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ github.sha }}
          restore-keys: ondra-incremental-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-

      # The remote helper (fat LTO) takes one to two minutes and rarely changes. Its build is kept
      # under the hash of its sources (here also src-tauri/src/winvault.rs, which it compiles in) and
      # this file; on an exact match those sources are dated back, so cargo finds the kept build up to
      # date and uses it instead of compiling it again.
      - id: remote
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            remote/host/target/${{ env.TARGET }}/release/ondra?remote*
            remote/host/target/${{ env.TARGET }}/release/deps/ondra?remote*
            remote/host/target/${{ env.TARGET }}/release/.fingerprint/ondra-remote-*
          key: ondra-remote-${{ runner.os }}-${{ env.RUSTUP_TOOLCHAIN }}-${{ hashFiles('remote/host/**', '!remote/host/target/**', 'src-tauri/src/winvault.rs', '.github/workflows/windows.yml') }}

      - name: Use the kept remote helper build
        if: steps.remote.outputs.cache-hit == 'true'
        run: git ls-files remote/host src-tauri/src/winvault.rs | ForEach-Object { (Get-Item $_).LastWriteTime = [datetime]'2000-01-01' }

      - name: Build the pinned coding agent
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $engine = Join-Path $env:RUNNER_TEMP engine
          git init --quiet $engine
          Set-Location $engine
          git config core.autocrlf false
          git config core.longpaths true
          git fetch --no-tags --depth 1 https://github.com/3x-haust/3xhaustpi.git $env:ENGINE_REV
          git checkout --detach $env:ENGINE_REV
          npm ci --ignore-scripts
          npm run build:offline
          "ONDRA_ENGINE_DIST=$((Resolve-Path packages/coding-agent/dist).Path)" >> $env:GITHUB_ENV

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build unsigned installer
        env:
          ONDRA_ENGINE_BUN_EXE: ${{ steps.bun.outputs.bun-path }}
        # rust-cache turns incremental builds off; the release profile's own setting (on for the app,
        # off for the remote helper) applies here, as in a release build.
        run: |
          Remove-Item Env:CARGO_INCREMENTAL -ErrorAction Ignore
          pnpm tauri build --target $env:TARGET --bundles nsis --ci --no-sign '--' --locked

      - name: Verify installed payload
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bundles = "src-tauri/target/$env:TARGET/release/bundle/nsis"
          $setup = @(Get-ChildItem $bundles -Filter '*-setup.exe' -File)
          if ($setup.Count -ne 1) { throw "Expected one NSIS installer in $bundles; found $($setup.Count)" }
          $installed = Join-Path $env:RUNNER_TEMP installed
          $process = Start-Process $setup[0].FullName -ArgumentList '/S', "/D=$installed" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS installer exited with $($process.ExitCode)" }

          foreach ($file in 'ondra.exe', 'ondra-browser.exe', 'browse.exe', 'components.json', 'engine/package.json', 'engine/photon_rs_bg.wasm',
                   'engine/native/win32/prebuilds/win32-x64/win32-platform.node', 'engine/THIRD_PARTY_NOTICES.txt') {
            if ((Get-Item -LiteralPath (Join-Path $installed $file)).Length -eq 0) { throw "Empty installed file: $file" }
          }
          $builtHash = (Get-FileHash "src-tauri/binaries/ondra-remote-$env:TARGET.exe" -ErrorAction Stop).Hash
          $installedHash = (Get-FileHash "$installed/ondra-remote.exe" -ErrorAction Stop).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed remote helper differs from the build' }
          $builtHash = (Get-FileHash "src-tauri/binaries/ondra-dictate-$env:TARGET.exe" -ErrorAction Stop).Hash
          $installedHash = (Get-FileHash "$installed/ondra-dictate.exe" -ErrorAction Stop).Hash
          if ($installedHash -ne $builtHash) { throw 'Installed dictation helper differs from the build' }
          $expected = (Get-Content "$env:ONDRA_ENGINE_DIST/../package.json" -Raw | ConvertFrom-Json).version
          Set-Location $installed
          $version = & ./engine/ondra-engine.exe --version
          if ($version -ne $expected) { throw "Installed engine reported '$version'; expected '$expected'" }
          Get-FileHash $setup[0].FullName | Format-List

      - name: Check first launch and relaunch
        run: |
          $exe = Join-Path $env:RUNNER_TEMP installed/ondra.exe
          $first = Start-Process $exe -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(1)
            do {
              $first.Refresh()
              if ($first.HasExited) { throw "Ondra exited during startup: $($first.ExitCode)" }
              if ($first.MainWindowHandle -ne 0) { break }
              Start-Sleep -Milliseconds 250
            } until ((Get-Date) -ge $deadline)
            if ($first.MainWindowHandle -eq 0) { throw 'Ondra did not open a window' }
            # the browser component: fetched from components.json, checked and unpacked by the app
            # (it unpacks into a hidden ".<version>.<pid>.tmp" folder first, so only a version folder counts)
            $installedChrome = {
              Get-ChildItem "$env:APPDATA/dev.3xhaust.ondra/components/chrome" -Directory -ErrorAction Ignore |
                Where-Object { !$_.Name.StartsWith('.') -and (Test-Path (Join-Path $_.FullName 'chrome-headless-shell-win64/chrome-headless-shell.exe')) }
            }
            $deadline = (Get-Date).AddMinutes(3)
            while (!(& $installedChrome) -and (Get-Date) -lt $deadline) { Start-Sleep -Seconds 2 }
            if (!(& $installedChrome)) { throw 'The app did not install the browser component' }
            $second = Start-Process $exe -PassThru
            if (!$second.WaitForExit(15000) -or $second.ExitCode -ne 0 -or $first.HasExited) {
              throw 'Relaunch did not reuse the running app'
            }
          } finally {
            if (!$first.HasExited) { $first.Kill(); $first.WaitForExit() }
          }

      - name: Use the browser tool
        timeout-minutes: 10
        shell: bash
        run: |
          # a password saved the way a user saves one (Credential Manager), read by the installed app
          cmd //c "cmdkey /generic:127.0.0.1 /user:ci@example.com /pass:s3cret!!!"
          trap 'cmd //c "cmdkey /delete:127.0.0.1"' EXIT
          installed=$(cygpath -u "$RUNNER_TEMP")/installed
          # the Chrome the app installed at first launch
          chrome=$(ls "$(cygpath -u "$APPDATA")"/dev.3xhaust.ondra/components/chrome/*/chrome-headless-shell-win64/chrome-headless-shell.exe | head -1)
          .github/browser/smoke.sh "$installed" "$chrome" "$installed/browse.exe"

      - name: Run Windows platform tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:CARGO_INCREMENTAL -ErrorAction Ignore
          pnpm test src/engine/farPaths.test.ts src/lib/nativeAssets.test.ts
          cargo test --manifest-path remote/host/Cargo.toml --release --target $env:TARGET --locked identity
          cargo test --manifest-path dictate/Cargo.toml --release --target $env:TARGET --locked
          # One run for all filters: a run per filter compiled the test build again after the first.
          cargo test --manifest-path src-tauri/Cargo.toml --release --target $env:TARGET --locked --lib '--' --test-threads=1 `
            remote::power::tests winvault::tests providers::tests::keychain_wrapper_stores_reads_and_deletes `
            farfs::tests components::tests::bundled_engine_needs_the_platform_executable_and_its_assets `
            fs::tests::copy_image_puts_the_picture_on_the_clipboard `
            components::tests::chrome_zip_unpacks_into_a_runnable_browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Ondra-windows-x64-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
